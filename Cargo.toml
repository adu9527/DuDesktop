[workspace]
members = ["crates/deskshell", "crates/wallpaper-host", "crates/protocol", "crates/render", "crates/shell-win"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
render = { path = "crates/render" }
shell-win = { path = "crates/shell-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
